<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <h1 id="siteTitle">Photo Gallery</h1>
  <div class="header-actions">
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    <button id="fullscreenBtn" class="icon-btn" title="Full Screen" aria-label="Full Screen">&#9974;</button>
  </div>
</header>

<nav class="layout-tabs" id="layoutTabs">
  <button data-layout="slideshow" class="layout-tab active">Slideshow</button>
  <button data-layout="hero" class="layout-tab">Hero + Thumbnails</button>
  <button data-layout="grid" class="layout-tab">Grid</button>
  <button data-layout="masonry" class="layout-tab">Masonry</button>
</nav>

<main id="app">

  <!-- Slideshow Layout -->
  <section id="slideshowView" class="view active">
    <div class="slideshow-stage" id="stage">
      <div class="slide-caption-overlay" id="captionOverlay"></div>
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">&#10094;</button>
      <div class="slides" id="slidesContainer"></div>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next">&#10095;</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="controls-bar">
      <button id="playPauseBtn" class="ctrl-btn">&#10073;&#10073;</button>
      <span class="counter" id="counter">1 / 1</span>
      <button id="shuffleBtn" class="ctrl-btn">Shuffle: Off</button>
    </div>
    <div class="thumb-strip" id="thumbStrip"></div>
  </section>

  <!-- Hero Layout -->
  <section id="heroView" class="view">
    <div class="hero-image-wrap">
      <img id="heroImage" src="" alt="">
      <div class="hero-caption" id="heroCaption"></div>
    </div>
    <div class="thumb-strip" id="heroThumbStrip"></div>
  </section>

  <!-- Grid Layout -->
  <section id="gridView" class="view">
    <div class="grid-gallery" id="gridGallery"></div>
  </section>

  <!-- Masonry Layout -->
  <section id="masonryView" class="view">
    <div class="masonry-gallery" id="masonryGallery"></div>
  </section>

</main>

<!-- Settings Panel -->
<aside id="settingsPanel" class="settings-panel">
  <div class="settings-header">
    <h2>Display Settings</h2>
    <button id="closeSettings" class="icon-btn">&times;</button>
  </div>
  <div class="settings-body">
    <label class="setting-row">
      <span>Slideshow interval</span>
      <select id="intervalSelect">
        <option value="3000">3 sec</option>
        <option value="5000" selected>5 sec</option>
        <option value="8000">8 sec</option>
        <option value="10000">10 sec</option>
        <option value="15000">15 sec</option>
      </select>
    </label>
    <label class="setting-row">
      <span>Order</span>
      <select id="orderSelect">
        <option value="sequential" selected>Sequential</option>
        <option value="shuffle">Shuffle</option>
      </select>
    </label>
    <label class="setting-row">
      <span>Show thumbnails</span>
      <input type="checkbox" id="thumbToggle" checked>
    </label>
    <label class="setting-row">
      <span>Show captions</span>
      <input type="checkbox" id="captionToggle" checked>
    </label>
    <label class="setting-row">
      <span>Transition</span>
      <select id="transitionSelect">
        <option value="fade" selected>Cross-fade</option>
        <option value="slide">Slide</option>
      </select>
    </label>
    <label class="setting-row">
      <span>Appearance</span>
      <select id="themeSelect">
        <option value="light">Light</option>
        <option value="dark" selected>Dark</option>
      </select>
    </label>
  </div>
</aside>
<div id="overlayBackdrop" class="overlay-backdrop"></div>

<footer class="site-footer">
  <span id="footerText">&nbsp;</span>
</footer>

<script src="photos.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
